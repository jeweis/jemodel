services:
  jemodel:
    image: jeweis/jemodel
    restart: always
    environment:
      JEMODEL_DATABASE_URL: sqlite:////data/jemodel.db
      JEMODEL_DATA_DIR: /data
      JEMODEL_SECRET_KEY: ${JEMODEL_SECRET_KEY:-jemodel}
      JEMODEL_BOOTSTRAP_ADMIN_API_KEY: ${JEMODEL_BOOTSTRAP_ADMIN_API_KEY:-}
      JEMODEL_BOOTSTRAP_ADMIN_EMAIL: admin@local.jemodel
      JEMODEL_BOOTSTRAP_ADMIN_NAME: Local Admin
      JEMODEL_EXPERIMENTAL_CODEX_OAUTH: "true"
      JEMODEL_MOCK_UPSTREAMS: ${JEMODEL_MOCK_UPSTREAMS:-false}
    ports:
      - "${JEMODEL_PORT:-8010}:8000"
    volumes:
      - jemodel-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jemodel-data:
